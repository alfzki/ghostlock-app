# Physical address pair. The image-to-direct-map alias is
#   ((kernel_phys_load + image_offset) - kernel_phys_offset) | PAGE_OFFSET
# so the pair CANCELS when the two are equal, leaving PAGE_OFFSET | image_offset.
# That is exactly the address preload.so wrote on this device (RESULT PASS,
# selinux=Permissive): 0xffffff8000000000 | 0x27C6960 = 0xffffff80027c6960,
# logged with phys_load_delta=0x0. Both are therefore 0x80000000.
#
# A previous value of kernel_phys_load=4294901760 (0xffff0000) with
# kernel_phys_offset=0 was host contamination: the extractor read the build
# machine's /proc/iomem, whose "Kernel code" line is all-zero under
# kptr_restrict, so 0 - 0x10000 wrapped to 0xffff0000. That pair computed an
# alias of 0xffffff81027b6960 -- 0xffff0000 bytes past the real target.
# See docs/development/61258-fdgraph-w1-plan.md.
kernel_phys_load = 2147483648
kernel_phys_offset = 2147483648
