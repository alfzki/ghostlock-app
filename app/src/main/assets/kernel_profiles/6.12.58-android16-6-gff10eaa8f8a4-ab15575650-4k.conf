#  - A tcp_zerocopy switch was attempted and ROLLED BACK. Do not redo it by
#    writing `route { tcp_zerocopy { compact_waiter = 0 } }`: the app rejects
#    compact_waiter = 0 (AndroidProfileConfigController.kt:145), and forcing it
#    to 1 to satisfy validation would make the route plant task/lock at the
#    wrong offsets. Reason, precisely:
#      * BTF for THIS image shows rt_mutex_waiter with BOTH a `tree` at 0x0 and
#        a `pi_tree` at 0x28 (two rb_nodes, size 0x70) => the 6.6/6.12
#        NON-compact layout.
#      * The tcp route writes waiter->task / waiter->lock at the FIXED offsets
#        zc[0x28] / zc[0x30] (tcp_zerocopy_route.cpp:318-319) and reads NO
#        waiter-geometry field, so the profile cannot correct it. Those
#        constants are the 6.1 COMPACT family's layout; they do not match this
#        kernel's non-compact waiter. compact_waiter is a family/provenance
#        marker, not a runtime layout switch.
#      * The zc output struct itself IS 0x40-shaped here and the two words ARE
#        genuinely planted -- sizeof(struct tcp_zerocopy_receive) = 0x40
#        (do_tcp_getsockopt: `0b6c sub w2,w8,#0x40` then `bl 0x16ab50`), and the
#        copy_from_user length is the CALLER's optlen (`0b44 ldr x25,[sp]` ->
#        `0b54 mov x2,x25`), so all 64 bytes including 0x28/0x30 are copied.
#        That proves the PRIMITIVE exists; it does NOT prove the planted words
#        land on task/lock. Conflating those two geometries is what produced the
#        earlier "no code change needed" conclusion. See
#        docs/development/tcp-zerocopy-6x-plan.md, "批次 3 阻塞".
#  - kernel_phys_load / kernel_phys_offset are MEASURED on the device with
#    tools/mtk-phys/mtk-phys.sh (2026-10-02, rooted via preload.so, kptr_restrict
#    temporarily set to 0 by that script):
#      kernel_phys_load   = 2147418112 (0x7fff0000)
#      kernel_phys_offset = 2147483648 (0x80000000)
#    These MUST be set for this device. This is a MediaTek MT6993, and with both
#    fields null the runtime falls back to the MTK SoC formula
#    (KIMAGE_TEXT_BASE - MTK_VADDR_BASE) in memory/address_space.cpp, which
#    yields kernel_phys_load = 0x80000000 -- wrong by exactly 0x10000, matching
#    the script's delta (_stext - _text) = 65536. Every image->direct-map
#    translation was therefore off by 64 KiB.
#  - The two DEVICE GATE entries below were produced on **select_stack**, which
#    is the route this profile selects. tcp_zerocopy has never been run on the
#    device at all, so these panics say nothing about it either way.
#  - DEVICE GATE (2026-10-02, V2514 / PD2502EF_EX_A_16.0.25.7.W20, cold boot,
#    KernelSU not loaded, single route): with the two phys fields still null, two
#    runs of the same build both ended in a kernel panic
#    (ro.boot.bootreason=kernel_panic), each stopping at
#      pselect pre-select attempt=1/1 compact=0
#    inside W1's select_stack route -- i.e. the 64 KiB mistranslation above.
#    Per session/backend/cve_2026_43499_backend.cpp the ancillary PreSpawn stage
#    runs only AFTER w1() returns Continue, so the vr.ko guard below was never
#    reached.
#  - DEVICE GATE ATTEMPT 2 (2026-10-02, same conditions, phys now measured): still
#    ro.boot.bootreason=kernel_panic, still stopping at
#      pselect pre-select attempt=1/1 compact=0
#    after CMP_REQUEUE_PI ret=-1 errno=35 (EAGAIN). The correction did deepen the
#    run: the page validator now rejects and retries bad spray pages
#    ("stores an even byte over selinux_state.initialized") and settles on
#    attempt=2, and the init_cred alias moved down by exactly one page. So the
#    physical-address mistranslation was real and is now fixed, and the residual
#    panic is in the select_stack route itself, not in the address math.
#  - ROOT CAUSE (settled 2026-10-02 by hand-disassembly, no further device runs
#    needed). select_stack is ARCHITECTURALLY INFEASIBLE on this kernel, and the
#    blocker is a HARD KERNEL CEILING -- not a tunable.
#    (a) The route's addressable window. From route/select_stack_route.cpp:
#      PSELECT_ROUTE_NFDS = 320 (kernel/constants.hpp), bits_per_word = 64 on
#      aarch64 => pselect_words_per_set() = 5. pselect_put_global_word() maps
#      global_word -> set_idx = global_word / 5 and accepts only set_idx 0..2, so
#      the controllable window is global_word in [0, 14]. The non-compact
#      rt_mutex_waiter table plants words 2..14 (task=12, lock=13, wake_state=14)
#      with global_word = waiter_shift + word, hence only waiter_shift <= 0 works:
#        shift= 0 -> 13/13 words placeable    shift= 1 -> wake_state dropped
#        shift= 3 -> task dropped             shift=14 -> 0/13 placeable
#      (the extractor's own "max feasible shift is 3" text is too loose; the real
#      ceiling for this table is 0).
#    (b) The window CANNOT be widened. Disassembling core_sys_select@0x15ad80 in
#      THIS image shows the kernel keeps the fd_set buffers on its own stack only
#      while round_down(FDS_BYTES(nfds), 8) < 43:
#        0094 add x8,x24,#0x3f | 0098 lsr x8,x8,#0x3   x8  = FDS_BYTES(nfds)
#        009c and x25,x8,#0x1ffffffffffffff8           x25 = round_down(x8, 8)
#        00a4 cmp x25,#0x2b (43) | 00a8 b.hs -> rel 0x288
#        0288 lsl x26,x27,#0x1 | 02a0 bl 0x1054e8      -> kmalloc_node() on the HEAP
#      So: nfds=320 -> 40 B -> stack (current); nfds=321 -> 48 B -> kmalloc;
#      nfds=640 -> 80 B -> kmalloc. PSELECT_ROUTE_NFDS=320 is ALREADY THE CEILING,
#      words_per_set<=5 and window<=[0,14]. A heap fd_set buffer can never overlap
#      the on-stack futex waiter, so raising nfds destroys the primitive instead of
#      extending it. Adding a profile-driven width field or bumping the constant
#      would therefore be WRONG, not merely insufficient.
#    (c) Why the other 6.12 profiles work. The 13 device-verified Qualcomm
#      android16-5 profiles all use waiter_shift = 0, i.e. words 2..14 land inside
#      [0,14]. This MediaTek train genuinely differs: its measured shift is +14
#      (independently reproduced: pselect chain __arm64_sys_pselect6(0xa0) +
#      core_sys_select(0x1b0) = 592; futex chain __arm64_sys_futex(0x80) +
#      futex_wait_requeue_pi(0x1c0) = 576; pselect_buffer=0x40, waiter_local=0xa0;
#      delta = -416 - (-528) = 112 B = 14 qwords). No configuration of the existing
#      primitive can bridge a 14-qword gap under a 15-qword ceiling.
#    (d) No substitute route. The tcp_zerocopy PRIMITIVE does exist on this image
#      (two direct `bl tcp_zerocopy_vm_insert_batch` in do_tcp_getsockopt at
#      0de0/0e90), so the earlier "symbol missing => route unusable" reasoning was
#      wrong and is withdrawn. The real blocker is GEOMETRY, not availability:
#      the route plants waiter->task/waiter->lock at fixed zc[0x28]/zc[0x30],
#      which are the 6.1 COMPACT constants, while this kernel's waiter is
#      non-compact (tree@0x0 + pi_tree@0x28, size 0x70). The route reads no
#      waiter-geometry field, so no profile value can bridge that. Declaring
#      compact_waiter = 1 would satisfy the app validator while writing task/lock
#      to the wrong addresses -- i.e. corrupting a live kernel object, the same
#      failure class as the panics above. multicast_waiter is 5.x only.
#      Consequently NO available route completes W1 here, the ancillary PreSpawn
#      vr.ko guard is unreachable, and the vr.ko bypass stays UNPROVEN on hardware.
#    Do NOT list this release as a supported device: it must also stay out of
#    kernel_profiles/index.conf, which is what actually arms it at runtime (see
#    the HAZARD note at the top of this file). Supporting
#    this device requires profile-parameterising the tcp_zerocopy waiter geometry
#    (task/lock offsets) -- an attack-path change needing a plan document,
#    cmp_disasm on the 8 attack functions, and a device gate; not a profile edit.
#  - vr_guard.funcs_offset = 72 (0x48) is BTF-derived
#    (offsetof(struct tracepoint, funcs)) for THIS kernel, not inferred from the
#    kernel release. PR #221 forbids guessing it from the minor version.
#  - vr_guard.enabled is a deliberate support-list decision: /proc/modules on this
#    device shows `vr 40960 0 [permanent]`. __tracepoint_sys_exit alone proves
#    nothing, so the extractor never sets this field.
#  - vr_guard.tag_b_off = 44 (0x2c) is the vivo vr.ko tag B offset shared with the
#    6.1 profile, from vr.ko disassembly.
